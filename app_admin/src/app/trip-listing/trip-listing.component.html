<div class="row">
  <div class="col-md-12">
    <button
      (click)="addTrip()"
      class="btn btn-info">
      Add Trip
    </button>
  </div>

  <div *ngFor="let trip of trips" class="col-md-4">
    <app-trip-card
      [trip]="trip"
      class="card-deck mt-2">
    </app-trip-card>
  </div>
</div>
